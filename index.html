<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PARIN X PARKINMODZ VIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Kanit:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00f2fe;
            --accent: #00ff88;
            --glass: rgba(255, 255, 255, 0.07);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background: #050505;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* FPS & System Status */
        .status-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: var(--primary);
            letter-spacing: 1px;
            text-shadow: 0 0 5px var(--primary);
        }

        .container {
            width: 98%;
            max-width: 650px;
            padding: 20px 10px;
            background: radial-gradient(circle at top, rgba(0, 242, 254, 0.1), transparent);
            border-radius: 25px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 10px;
            opacity: 0.5;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* เธเธฑเธเธเธฑเธเนเธซเนเธงเธฒเธเธเนเธฒเธเธเธฑเธเน€เธชเธกเธญ */
        .carousel {
            display: flex;
            flex-direction: row; /* เธเธฑเธเธเธฑเธเนเธเธงเธเธญเธ */
            justify-content: center;
            gap: 10px;
            padding: 0 5px;
        }

        .card {
            flex: 1; /* เนเธเนเธเธเธทเนเธเธ—เธตเนเน€เธ—เนเธฒเธเธฑเธ */
            max-width: 200px; /* เธเธณเธเธฑเธ”เธเธงเธฒเธกเธเธงเนเธฒเธเนเธกเนเนเธซเนเธเธงเธก */
            background: rgba(20, 20, 20, 0.8);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card img {
            width: 100%;
            height: 120px; /* เธฅเธ”เธเธงเธฒเธกเธชเธนเธเธฃเธนเธเนเธเธกเธทเธญเธ–เธทเธญ */
            object-fit: cover;
            opacity: 0.8;
        }

        .info {
            padding: 10px;
            text-align: left;
        }

        .info h2 {
            font-size: 12px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Orbitron', sans-serif;
        }

        .dot {
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        .info p {
            font-size: 9px;
            color: #aaa;
            margin: 5px 0 35px 0;
            line-height: 1.2;
        }

        .btn-activate {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 8px 0;
            background: linear-gradient(to right, #111, #222);
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-activate:active {
            background: var(--primary);
            color: #000;
        }

        /* Notification */
        #notification {
            position: fixed;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10000;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #notification.active { top: 20px; }

        .noti-icon { color: var(--accent); font-size: 20px; }
        .noti-text b { font-size: 12px; display: block; color: var(--primary); }
        .noti-text span { font-size: 10px; }
    </style>
</head>
<body>

<div class="status-bar">
    <div>SYSTEM: PARKIN IOS / AD</div>
    <div id="fps-counter">FPS: 120.0</div>
</div>

<div class="container">
    <h1>PARIN X PARKIN</h1>
    <p class="subtitle">PREMIUM VIP PANEL OB52</p>

    <div class="carousel">
        <div class="card">
            <img src="https://i.pinimg.com/originals/14/a6/05/14a6051f40d98f3a41ad5955d59146f5.gif">
            <div class="info">
                <h2><div class="dot"></div> AIMBOT</h2>
                <p>เธฅเนเธญเธเน€เธเนเธฒเนเธกเนเธเธขเธณ 100%</p>
            </div>
            <button class="btn-activate" onclick="activate('PARKIN AIMBOT')">ACTIVATE</button>
        </div>

        <div class="card">
            <img src="https://i.pinimg.com/originals/a4/7c/ce/a47cce4a957388f66960a32e0d8a1406.gif">
            <div class="info">
                <h2><div class="dot"></div> SETTING</h2>
                <p>เธชเธนเธ•เธฃเธเธงเธฒเธกเนเธง VIP</p>
            </div>
            <button class="btn-activate" onclick="activate('PARKIN SETTING')">ACTIVATE</button>
        </div>
    </div>
</div>

<div id="notification">
    <i class="fa-solid fa-shield-check noti-icon"></i>
    <div class="noti-text">
        <b>SYSTEM INJECTED</b>
        <span id="noti-msg">...</span>
    </div>
</div>

<audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    // เธฃเธฐเธเธเธชเธธเนเธก FPS เนเธซเนเธงเธดเนเธเธ—เธตเน 120+
    const fpsElement = document.getElementById('fps-counter');
    function updateFPS() {
        const fps = (Math.random() * (124.8 - 120.1) + 120.1).toFixed(1);
        fpsElement.innerText = `FPS: ${fps}`;
        requestAnimationFrame(() => {
            setTimeout(updateFPS, 100);
        });
    }
    updateFPS();

    function activate(name) {
        // เน€เธฅเนเธเน€เธชเธตเธขเธ
        const sound = document.getElementById("successSound");
        sound.currentTime = 0;
        sound.play().catch(() => {});

        // เนเธชเธ”เธเนเธเนเธเน€เธ•เธทเธญเธ
        const noti = document.getElementById("notification");
        const msg = document.getElementById("noti-msg");
        msg.innerText = "เน€เธเธดเธ”เนเธเนเธเธฒเธ " + name + " เน€เธฃเธตเธขเธเธฃเนเธญเธข!";
        
        noti.classList.add("active");
        
        if (navigator.vibrate) navigator.vibrate(50);

        setTimeout(() => {
            noti.classList.remove("active");
        }, 3000);
    }
</script>

</body>
  </html>
